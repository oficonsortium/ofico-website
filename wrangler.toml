name = "ofico-website"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Deployed by Cloudflare Workers Builds: push to main -> production,
# any other branch -> preview URL. Manual fallback: `npm run deploy`.
preview_urls = true
routes = [
  { pattern = "oficonsortium.org", custom_domain = true },
  { pattern = "www.oficonsortium.org", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
